name: CI

on:
  push:
  pull_request:

jobs:
  defconfigs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc cpio curl file rsync unzip wget
      - name: Check Buildroot defconfigs
        run: ./scripts/check-defconfigs.sh
