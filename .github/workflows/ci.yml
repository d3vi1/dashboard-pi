name: CI

on:
  push:
  pull_request:

jobs:
  defconfigs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc cpio curl file ripgrep rsync unzip wget
      - name: Check Buildroot defconfigs
        run: ./scripts/check-defconfigs.sh
      - name: Verify pinned WPE WebKit source
        run: |
          make -C "$HOME/.cache/dashboard-pi/buildroot-2026.05" \
            BR2_EXTERNAL="$HOME/.cache/dashboard-pi/br2_external_dashboard_pi" \
            O="$HOME/.cache/dashboard-pi/check/dashboard_pi_rpi4_64_defconfig" \
            dashboard-pi-wpewebkit-source
