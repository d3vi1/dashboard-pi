# ISC DHCP example for Dashboard Pi DHCPv4 MVP.

option dashboard-url code 224 = text;
option dashboard-controller-url code 225 = text;

class "dashboard-pi" {
  match if option vendor-class-identifier = "Dashboard-Pi";
}

subnet 192.0.2.0 netmask 255.255.255.0 {
  range 192.0.2.100 192.0.2.150;
  option routers 192.0.2.1;
  option domain-name-servers 192.0.2.53;

  pool {
    allow members of "dashboard-pi";
    option dashboard-url "https://dashboard.example.net/wallboard";
    # Reserved for future enterprise use. V1 does not require or use this.
    # option dashboard-controller-url "https://controller.example.net/";
    option log-servers 192.0.2.20;
  }
}
