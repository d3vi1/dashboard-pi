# dnsmasq example for Dashboard Pi DHCPv4 MVP.
# Option 224 carries the dashboard URL as text.

dhcp-vendorclass=set:dashboard-pi,Dashboard-Pi
dhcp-option=tag:dashboard-pi,224,https://dashboard.example.net/wallboard
# Option 225 is reserved for future enterprise controller URL use and is not
# required by V1.
# dhcp-option=tag:dashboard-pi,225,https://controller.example.net/
dhcp-option=tag:dashboard-pi,7,192.0.2.20
